spring.application.name=product-activation
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_activation}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

app.provider.base-url=${PROVIDER_BASE_URL:http://localhost:9090}
app.provider.connect-timeout-ms=${PROVIDER_CONNECT_TIMEOUT_MS:2000}
app.provider.read-timeout-ms=${PROVIDER_READ_TIMEOUT_MS:5000}
app.provider.max-attempts=${PROVIDER_MAX_ATTEMPTS:3}
app.provider.backoff-ms=${PROVIDER_BACKOFF_MS:200}

# ASYNC | SYNC | DISABLED
app.activation.mode=${ACTIVATION_MODE:ASYNC}
app.activation.thread-pool-size=${ACTIVATION_THREAD_POOL_SIZE:4}

# Habilita OAuth2 Resource Server (JWT + escopos). Desligado para dev local.
# Quando habilitado, defina SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI ou JWK set URI.
app.security.enabled=${SECURITY_ENABLED:false}

# Circuit breaker (Resilience4j) sobre a chamada ao provedor externo.
# Falhas: excecoes de rede (qualquer RuntimeException) e respostas HTTP >= 500.
resilience4j.circuitbreaker.instances.provider.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.provider.sliding-window-size=10
resilience4j.circuitbreaker.instances.provider.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.provider.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.provider.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.provider.permitted-number-of-calls-in-half-open-state=3

management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
